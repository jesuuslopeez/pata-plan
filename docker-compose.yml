services:
  db:
    image: postgres:16-alpine
    volumes:
      - pataplan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pataplan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pataplan-network

volumes:
  pataplan-data:

networks:
  pataplan-network:
    driver: bridge
